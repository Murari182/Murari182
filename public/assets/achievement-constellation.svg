<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap');
      .mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
      .serif { font-family: 'Cinzel', Georgia, serif; }
    </style>

    <linearGradient id="const-blue-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="40%" stop-color="#091426" />
      <stop offset="80%" stop-color="#0D1E3A" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Enhanced Glowing Star Halo Gradients -->
    <radialGradient id="star-halo-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="25%" stop-color="#38BDF8" stop-opacity="0.95" />
      <stop offset="65%" stop-color="#1D4ED8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#050811" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="star-halo-blue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="30%" stop-color="#60A5FA" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#1E3A5F" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#050811" stop-opacity="0" />
    </radialGradient>

    <!-- Filters for Radiant Stellar Bloom -->
    <filter id="stellar-bloom" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="2" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="star-flare" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="920" height="340" rx="16" fill="url(#const-blue-bg)" />
  <rect width="920" height="340" rx="16" fill="none" stroke="#1E3A5F" stroke-width="1.2" />

  <!-- Twinkling Stardust Field -->
  <g opacity="0.6">
    <circle cx="80" cy="80" r="1.5" fill="#F0F6FC">
      <animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="210" cy="280" r="1.2" fill="#38BDF8">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="350" cy="140" r="1.5" fill="#60A5FA">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.1s" repeatCount="indefinite" />
    </circle>
    <circle cx="590" cy="60" r="1.2" fill="#F0F6FC">
      <animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="730" cy="270" r="1.5" fill="#38BDF8">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="850" cy="130" r="1.2" fill="#60A5FA">
      <animate attributeName="opacity" values="0.1;0.8;0.1" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Concentric Astral Celestial Coordinate Rings with Continuous Rotation -->
  <g transform="translate(460, 170)">
    <!-- Outer Ring -->
    <circle cx="0" cy="0" r="145" fill="none" stroke="#1E3A5F" stroke-width="1" stroke-dasharray="3 8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="80s" repeatCount="indefinite" />
    </circle>
    <!-- Middle Ring -->
    <circle cx="0" cy="0" r="235" fill="none" stroke="#2563EB" stroke-opacity="0.35" stroke-width="0.8" stroke-dasharray="4 10">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="60s" repeatCount="indefinite" />
    </circle>
    <!-- Inner Coordinate Compass Marks -->
    <circle cx="0" cy="0" r="70" fill="none" stroke="#38BDF8" stroke-opacity="0.25" stroke-width="0.8" stroke-dasharray="2 6">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Top Telemetry Header -->
  <g class="mono" font-size="10.5">
    <text x="40" y="34" fill="#38BDF8" font-weight="600" letter-spacing="2">
      ACHIEVEMENT CONSTELLATION <tspan fill="#60A5FA">▪</tspan> VERIFIED MILESTONES
    </text>
    <text x="880" y="34" text-anchor="end" fill="#94A3B8" opacity="0.8" letter-spacing="1.5">
      BLUE TELEMETRY // 6 UNLOCKED · 1 EVOLVING
    </text>
  </g>

  <!-- Corner Precision Reticles -->
  <path d="M 16 30 L 16 16 L 30 16" fill="none" stroke="#38BDF8" stroke-width="1.5" />
  <path d="M 904 16 L 904 30" fill="none" stroke="#38BDF8" stroke-width="1.5" />
  <path d="M 890 16 L 904 16" fill="none" stroke="#38BDF8" stroke-width="1.5" />
  <path d="M 16 310 L 16 324 L 30 324" fill="none" stroke="#38BDF8" stroke-width="1.5" />
  <path d="M 904 310 L 904 324 L 890 324" fill="none" stroke="#38BDF8" stroke-width="1.5" />

  <!-- ================= ANIMATED CONSTELLATION BEAMS ================= -->
  <g stroke="#1E3A5F" stroke-width="1.6" stroke-dasharray="4 4" opacity="0.9">
    <line x1="120" y1="220" x2="240" y2="110" />
    <line x1="240" y1="110" x2="460" y2="75" />
    <line x1="460" y1="75" x2="680" y2="110" />
    <line x1="680" y1="110" x2="800" y2="220" />
    <line x1="460" y1="75" x2="460" y2="200" />
    <line x1="240" y1="110" x2="460" y2="200" />
    <line x1="680" y1="110" x2="460" y2="200" />
    <line x1="120" y1="220" x2="460" y2="200" />
    <line x1="800" y1="220" x2="460" y2="200" />
    <!-- Evolution Beam to Polaris (460, 265) -->
    <line x1="460" y1="200" x2="460" y2="265" stroke="#38BDF8" stroke-dasharray="2 4" stroke-width="1.8" />
  </g>

  <!-- Glowing Traveling Energy Pulses along Constellation Beams -->
  <circle r="2.5" fill="#38BDF8" filter="url(#star-flare)">
    <animateMotion path="M 120 220 L 240 110 L 460 75 L 680 110 L 800 220 L 460 200 Z" dur="8s" repeatCount="indefinite" />
  </circle>

  <!-- ================= CONSTELLATION STARS / VERIFIED NODES ================= -->

  <!-- Star 1: Alpha Genesis [First Public Repo] -->
  <g transform="translate(120, 220)">
    <circle cx="0" cy="0" r="18" fill="url(#star-halo-cyan)" filter="url(#stellar-bloom)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2.8s" repeatCount="indefinite" />
      <animate attributeName="r" values="16;20;16" dur="2.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="5" fill="#F0F6FC" />
    <text x="0" y="26" text-anchor="middle" class="mono" font-size="9" font-weight="600" fill="#38BDF8">GENESIS // 2025</text>
    <text x="0" y="38" text-anchor="middle" class="mono" font-size="8" fill="#94A3B8">FIRST REPOSITORY</text>
  </g>

  <!-- Star 2: Beta Rigor [C++ DSA] -->
  <g transform="translate(240, 110)">
    <circle cx="0" cy="0" r="18" fill="url(#star-halo-blue)" filter="url(#stellar-bloom)">
      <animate attributeName="opacity" values="0.5;0.95;0.5" dur="2.4s" repeatCount="indefinite" />
      <animate attributeName="r" values="16;19;16" dur="2.4s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="5" fill="#F0F6FC" />
    <text x="0" y="-18" text-anchor="middle" class="mono" font-size="9.5" font-weight="600" fill="#7DD3FC">DSA_CPP</text>
    <text x="0" y="-8" text-anchor="middle" class="mono" font-size="8" fill="#94A3B8">C++ ALGORITHMS</text>
  </g>

  <!-- Star 3: Vega Apex [Study_Agent Multi-Agent AI System] -->
  <g transform="translate(460, 75)">
    <circle cx="0" cy="0" r="24" fill="url(#star-halo-cyan)" filter="url(#stellar-bloom)">
      <animate attributeName="r" values="20;26;20" dur="2.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="8" fill="#F0F6FC" />
    <text x="0" y="-22" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#F0F6FC" letter-spacing="1">STUDY_AGENT // AI APEX</text>
    <text x="0" y="-10" text-anchor="middle" class="mono" font-size="8.5" fill="#38BDF8">MULTI-AGENT STUDY SYSTEM</text>
  </g>

  <!-- Star 4: Gamma Cloud [AWS ThinkChamp Practicum] -->
  <g transform="translate(680, 110)">
    <circle cx="0" cy="0" r="18" fill="url(#star-halo-blue)" filter="url(#stellar-bloom)">
      <animate attributeName="opacity" values="0.5;0.95;0.5" dur="2.6s" repeatCount="indefinite" />
      <animate attributeName="r" values="16;19;16" dur="2.6s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="5" fill="#F0F6FC" />
    <text x="0" y="-18" text-anchor="middle" class="mono" font-size="9.5" font-weight="600" fill="#7DD3FC">AWS CLOUD</text>
    <text x="0" y="-8" text-anchor="middle" class="mono" font-size="8" fill="#94A3B8">THINKCHAMP PRACTICUM</text>
  </g>

  <!-- Star 5: Delta Portfolio [Mukunda_Portfolio / FullStack Platform] -->
  <g transform="translate(800, 220)">
    <circle cx="0" cy="0" r="18" fill="url(#star-halo-cyan)" filter="url(#stellar-bloom)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3.2s" repeatCount="indefinite" />
      <animate attributeName="r" values="16;20;16" dur="3.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="5" fill="#F0F6FC" />
    <text x="0" y="26" text-anchor="middle" class="mono" font-size="9" font-weight="600" fill="#38BDF8">DEV PORTFOLIO</text>
    <text x="0" y="38" text-anchor="middle" class="mono" font-size="8" fill="#94A3B8">FULL-STACK ECOSYSTEM</text>
  </g>

  <!-- Star 6: Centauri Continuum [110+ 2026 Velocity] -->
  <g transform="translate(460, 200)">
    <circle cx="0" cy="0" r="20" fill="url(#star-halo-blue)" filter="url(#stellar-bloom)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite" />
      <animate attributeName="r" values="18;22;18" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="6.5" fill="#F0F6FC" />
    <text x="0" y="24" text-anchor="middle" class="mono" font-size="9.5" font-weight="700" fill="#BAE6FD">110+ COMMITS VELOCITY</text>
  </g>

  <!-- Star 7: Polaris Horizon [Target: AI Systems Engineer] -->
  <g transform="translate(460, 265)">
    <circle cx="0" cy="0" r="14" fill="#0B1528" stroke="#38BDF8" stroke-dasharray="2 3" stroke-width="1.4">
      <animate attributeName="stroke-dashoffset" from="0" to="20" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="4.5" fill="#60A5FA" />
    <text x="0" y="20" text-anchor="middle" class="mono" font-size="8.5" fill="#94A3B8">TARGET: AI SYSTEMS ENGINEER</text>
  </g>

  <!-- Bottom Telemetry Status Strip -->
  <g transform="translate(460, 314)">
    <rect x="-380" y="-14" width="760" height="26" rx="13" fill="#091426" fill-opacity="0.95" stroke="#1E3A5F" stroke-width="1" />
    <text x="0" y="3.5" text-anchor="middle" class="mono" font-size="9.5" fill="#94A3B8" letter-spacing="1.5">
      <tspan fill="#38BDF8">BLUE ASTRO-TELEMETRY:</tspan> VERIFIED MILESTONES <tspan fill="#1E3A5F">|</tspan> RGIPT [26.28° N] <tspan fill="#1E3A5F">|</tspan> <tspan fill="#7DD3FC">MUKUNDA // 0x182</tspan>
    </text>
  </g>
</svg>
