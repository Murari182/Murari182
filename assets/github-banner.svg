    d="M -60 230 C 240 330, 510 110, 820 245 C 1010 325, 1130 160, 1260 220 L 1260 410 L -60 410 Z"
    fill="url(#glassRibbon2)"
  >
    <animate attributeName="d" dur="12s" repeatCount="indefinite" values="
