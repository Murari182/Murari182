    Engineering Intelligence. Building Possibilities.
  </text>

  <!-- Subtle Pastel Accent Bar -->
  <rect x="112" y="282" width="180" height="3.5" rx="1.75" fill="url(#glassEdgeStroke)" />

  <!-- Bottom Verified Meta Line -->
  <text
    x="112"
    y="314"
    fill="#8190A5"
    font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace"
    font-size="12.5"
