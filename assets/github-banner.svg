    d="M -60 280 C 180 140, 420 360, 720 210 C 940 100, 1080 270, 1280 170"
    stroke="url(#glassEdgeStroke)"
    stroke-width="2.5"
    fill="none"
  />
  <path
    d="M -60 230 C 240 330, 510 110, 820 245 C 1010 325, 1130 160, 1260 220"
    stroke="#FFFFFF"
    stroke-width="3"
    stroke-opacity="0.9"
    fill="none"
  />

  <!-- Frosted Editorial Liquid Glass Content Card -->
  <rect
    x="64"
    y="44"
    width="1072"
    height="312"
    rx="28"
    fill="url(#frostedPanelFill)"
    stroke="#E5EAF2"
    stroke-width="1.5"
