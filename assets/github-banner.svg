    font-family="'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="72"
    font-weight="800"
    letter-spacing="-0.03em"
  >
    MUKUNDA.AI
  </text>

  <!-- Subtitle -->
  <text
    x="112"
    y="230"
    fill="#18243A"
    font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="22.5"
    font-weight="700"
    letter-spacing="-0.01em"
  >
    Mathematics &amp; Computing | Aspiring AI Engineer
  </text>

  <!-- Small Tagline -->
  <text
    x="112"
    y="264"
    fill="#52627A"
    font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="16"
    font-weight="500"
    font-style="italic"
