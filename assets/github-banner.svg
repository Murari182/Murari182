<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%" fill="none" role="img" aria-labelledby="mukundaBannerTitle mukundaBannerDesc">
  <title id="mukundaBannerTitle">MUKUNDA.AI — Mathematics &amp; Computing | Aspiring AI Engineer</title>
  <desc id="mukundaBannerDesc">Light-theme Apple Liquid Glass flowing ribbon banner for Sreeramadasu Mukunda Rama Chary (Murari182). Engineering Intelligence. Building Possibilities.</desc>

  <defs>
    <linearGradient id="canvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F8FBFF" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <radialGradient id="pastelBlueGlow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#EAF5FF" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#DDFBFA" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="pastelVioletGlow" cx="80%" cy="28%" r="48%">
      <stop offset="0%" stop-color="#F0EBFF" stop-opacity="0.95" />
      <stop offset="55%" stop-color="#E8DEFF" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="pastelPinkGlow" cx="62%" cy="82%" r="42%">
      <stop offset="0%" stop-color="#FFF0F6" stop-opacity="0.9" />
      <stop offset="65%" stop-color="#EAF5FF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <!-- Flowing Liquid Glass Ribbon 1 (Electric Blue -> Cyan -> Pastel Violet) -->
    <linearGradient id="glassRibbon1" x1="0%" y1="0%" x2="100%" y2="20%">
      <stop offset="0%" stop-color="#4779E8" stop-opacity="0.22" />
      <stop offset="45%" stop-color="#27BFCB" stop-opacity="0.28" />
      <stop offset="80%" stop-color="#9173E8" stop-opacity="0.24" />
      <stop offset="100%" stop-color="#FFF0F6" stop-opacity="0.35" />
    </linearGradient>

    <!-- Flowing Liquid Glass Ribbon 2 (Lavender -> Ice Blue -> Cyan) -->
    <linearGradient id="glassRibbon2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9173E8" stop-opacity="0.20" />
      <stop offset="50%" stop-color="#4779E8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#27BFCB" stop-opacity="0.24" />
    </linearGradient>

    <!-- Specular Glass Rim Stroke -->
    <linearGradient id="glassEdgeStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4779E8" stop-opacity="0.45" />
      <stop offset="35%" stop-color="#27BFCB" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#9173E8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#4779E8" stop-opacity="0.35" />
    </linearGradient>

    <!-- Frosted Center Card Fill -->
    <linearGradient id="frostedPanelFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.86" />
      <stop offset="60%" stop-color="#F8FBFF" stop-opacity="0.78" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.90" />
    </linearGradient>

    <!-- Brand Title Gradient -->
    <linearGradient id="brandTitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#18243A" />
      <stop offset="48%" stop-color="#4779E8" />
      <stop offset="78%" stop-color="#27BFCB" />
      <stop offset="100%" stop-color="#9173E8" />
    </linearGradient>
  </defs>

  <!-- Pure White & Pearl Base Canvas -->
  <rect width="1200" height="400" rx="28" fill="url(#canvasBg)" stroke="#E5EAF2" stroke-width="1.5" />
  <rect width="1200" height="400" rx="28" fill="url(#pastelBlueGlow)" />
  <rect width="1200" height="400" rx="28" fill="url(#pastelVioletGlow)" />
  <rect width="1200" height="400" rx="28" fill="url(#pastelPinkGlow)" />

  <!-- Layer 1: Background Flowing Glass Ribbon -->
  <path
    d="M -80 280 C 180 140, 420 360, 720 210 C 940 100, 1080 270, 1280 170 L 1280 410 L -80 410 Z"
    fill="url(#glassRibbon1)"
  >
    <animate attributeName="d" dur="10s" repeatCount="indefinite" values="
      M -80 280 C 180 140, 420 360, 720 210 C 940 100, 1080 270, 1280 170 L 1280 410 L -80 410 Z;
      M -80 250 C 210 190, 460 310, 740 180 C 960 140, 1100 230, 1280 195 L 1280 410 L -80 410 Z;
      M -80 280 C 180 140, 420 360, 720 210 C 940 100, 1080 270, 1280 170 L 1280 410 L -80 410 Z" />
  </path>

  <!-- Layer 2: Midground Translucent Wave with Specular Edge -->
