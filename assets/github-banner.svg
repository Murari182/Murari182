    B.Tech M&amp;C @ RGIPT (2025–Present)  ·  AI &amp; ML  ·  C++ &amp; Algorithms  ·  React &amp; FastAPI  ·  AWS Cloud
  </text>

  <!-- Right-Side Light Liquid Glass Orbital Emblem -->
  <g transform="translate(908, 86)">
    <rect
      x="0"
      y="0"
      width="180"
      height="180"
      rx="32"
      fill="#F8FBFF"
      stroke="#E5EAF2"
      stroke-width="1.5"
    />
    <circle cx="90" cy="90" r="64" fill="#EAF5FF" fill-opacity="0.7" />
    <circle
      cx="90"
      cy="90"
      r="54"
      stroke="#4779E8"
      stroke-opacity="0.45"
      stroke-width="1.5"
      stroke-dasharray="7 5"
      fill="none"
    />
    <circle
      cx="90"
      cy="90"
      r="38"
      fill="#FFFFFF"
      stroke="#27BFCB"
      stroke-opacity="0.55"
      stroke-width="1.5"
    />
    <text
      x="90"
      y="96"
      text-anchor="middle"
      fill="#18243A"
      font-family="'Outfit', sans-serif"
