<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
      .mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
      .serif { font-family: 'Cinzel', Georgia, serif; }
    </style>

    <linearGradient id="cloud-blue-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="45%" stop-color="#091426" />
      <stop offset="85%" stop-color="#0D1E3A" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Node Glow Filters -->
    <filter id="node-blue-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="packet-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="wire-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="920" height="320" rx="16" fill="url(#cloud-blue-bg)" />
  <rect width="920" height="320" rx="16" fill="none" stroke="#1E3A5F" stroke-width="1.2" />

  <!-- Corner Reticles -->
  <path d="M 16 30 L 16 16 L 30 16" fill="none" stroke="#38BDF8" stroke-width="1.5" />
  <path d="M 904 16 L 904 30" fill="none" stroke="#38BDF8" stroke-width="1.5" />
  <path d="M 890 16 L 904 16" fill="none" stroke="#38BDF8" stroke-width="1.5" />
  <path d="M 16 290 L 16 304 L 30 304" fill="none" stroke="#38BDF8" stroke-width="1.5" />
  <path d="M 904 290 L 904 304 L 890 304" fill="none" stroke="#38BDF8" stroke-width="1.5" />

  <!-- Top Telemetry Header -->
  <g class="mono" font-size="10.5">
    <text x="40" y="34" fill="#38BDF8" font-weight="600" letter-spacing="2">
      CLOUD INFRASTRUCTURE &amp; SERVERLESS PIPELINE <tspan fill="#60A5FA">▪</tspan> AWS TOPOLOGY
    </text>
    <text x="880" y="34" text-anchor="end" fill="#94A3B8" opacity="0.8" letter-spacing="1.5">
      TOPOLOGY // HIGH AVAILABILITY · ASYNC MICROSERVICES
    </text>
  </g>

  <!-- ================= NETWORK INTERCONNECT BUS & WIRES ================= -->
  <!-- Ingress to Compute to Storage to Observability -->
  <g stroke="#1E3A5F" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.8">
    <!-- Horizontal Core Backbone -->
    <line x1="120" y1="160" x2="800" y2="160" />
    <!-- Branch to EC2 (Top Left) -->
    <line x1="260" y1="160" x2="260" y2="90" />
    <!-- Branch to Lambda (Bottom Left) -->
    <line x1="260" y1="160" x2="260" y2="230" />
    <!-- Branch to S3 (Top Right) -->
    <line x1="560" y1="160" x2="560" y2="90" />
    <!-- Branch to SNS (Bottom Right) -->
    <line x1="560" y1="160" x2="560" y2="230" />
    <!-- Telemetry to CloudWatch -->
    <line x1="410" y1="160" x2="410" y2="230" />
  </g>

  <!-- Animated Data Packets Flowing through Wires -->
  <g>
    <!-- Packet 1: Horizontal Ingress -->
    <circle cx="0" cy="160" r="3.5" fill="#38BDF8" filter="url(#packet-glow)">
      <animate attributeName="cx" from="120" to="800" dur="4s" repeatCount="indefinite" />
    </circle>
    <!-- Packet 2: To EC2 -->
    <circle cx="260" cy="0" r="3" fill="#60A5FA" filter="url(#packet-glow)">
      <animate attributeName="cy" from="160" to="90" dur="2s" repeatCount="indefinite" />
    </circle>
    <!-- Packet 3: To Lambda -->
    <circle cx="260" cy="0" r="3" fill="#38BDF8" filter="url(#packet-glow)">
      <animate attributeName="cy" from="160" to="230" dur="2.4s" repeatCount="indefinite" />
    </circle>
    <!-- Packet 4: To S3 -->
    <circle cx="560" cy="0" r="3" fill="#60A5FA" filter="url(#packet-glow)">
      <animate attributeName="cy" from="160" to="90" dur="2.2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- ================= INFRASTRUCTURE NODES ================= -->

  <!-- Node 1: API Gateway (Ingress) -->
  <g transform="translate(120, 160)">
    <circle cx="0" cy="0" r="28" fill="#091426" stroke="#38BDF8" stroke-width="1.6" filter="url(#node-blue-glow)" />
    <circle cx="0" cy="0" r="10" fill="#2563EB" opacity="0.8">
      <animate attributeName="r" values="8;12;8" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="0" y="-36" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#F0F6FC">API GATEWAY</text>
    <text x="0" y="44" text-anchor="middle" class="mono" font-size="8.5" fill="#94A3B8">REST INGRESS</text>
  </g>

  <!-- Node 2: EC2 Instance (Provisioned Compute) -->
  <g transform="translate(260, 90)">
    <rect x="-36" y="-20" width="72" height="40" rx="8" fill="#091426" stroke="#60A5FA" stroke-width="1.4" filter="url(#node-blue-glow)" />
    <text x="0" y="-3" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#F0F6FC">AWS EC2</text>
    <text x="0" y="11" text-anchor="middle" class="mono" font-size="8" fill="#38BDF8">COMPUTE NODE</text>
  </g>

  <!-- Node 3: AWS Lambda (Serverless Compute) -->
  <g transform="translate(260, 230)">
    <rect x="-36" y="-20" width="72" height="40" rx="8" fill="#091426" stroke="#38BDF8" stroke-width="1.4" filter="url(#node-blue-glow)" />
    <text x="0" y="-3" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#F0F6FC">LAMBDA</text>
    <text x="0" y="11" text-anchor="middle" class="mono" font-size="8" fill="#60A5FA">SERVERLESS FN</text>
  </g>

  <!-- Node 4: FastAPI Microservices Core -->
  <g transform="translate(410, 160)">
    <circle cx="0" cy="0" r="32" fill="#0B1528" stroke="#38BDF8" stroke-width="2" filter="url(#node-blue-glow)">
      <animate attributeName="stroke-width" values="1.8;2.6;1.8" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="12" fill="#38BDF8" opacity="0.9" />
    <text x="0" y="-40" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="1">FASTAPI CORE</text>
    <text x="0" y="48" text-anchor="middle" class="mono" font-size="8.5" fill="#7DD3FC">ASYNC HANDLERS</text>
  </g>

  <!-- Node 5: AWS S3 (Scalable Storage) -->
  <g transform="translate(560, 90)">
    <rect x="-36" y="-20" width="72" height="40" rx="8" fill="#091426" stroke="#60A5FA" stroke-width="1.4" filter="url(#node-blue-glow)" />
    <text x="0" y="-3" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#F0F6FC">AWS S3</text>
    <text x="0" y="11" text-anchor="middle" class="mono" font-size="8" fill="#38BDF8">OBJECT STORAGE</text>
  </g>

  <!-- Node 6: AWS SNS (Pub/Sub Messaging) -->
  <g transform="translate(560, 230)">
    <rect x="-36" y="-20" width="72" height="40" rx="8" fill="#091426" stroke="#38BDF8" stroke-width="1.4" filter="url(#node-blue-glow)" />
    <text x="0" y="-3" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#F0F6FC">AWS SNS</text>
    <text x="0" y="11" text-anchor="middle" class="mono" font-size="8" fill="#60A5FA">PUB/SUB BUS</text>
  </g>

  <!-- Node 7: AWS CloudWatch (Telemetry & Alarms) -->
  <g transform="translate(740, 160)">
    <circle cx="0" cy="0" r="28" fill="#091426" stroke="#60A5FA" stroke-width="1.6" filter="url(#node-blue-glow)" />
    <circle cx="0" cy="0" r="9" fill="#38BDF8" opacity="0.9">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="0" y="-36" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#F0F6FC">CLOUDWATCH</text>
    <text x="0" y="44" text-anchor="middle" class="mono" font-size="8.5" fill="#94A3B8">LOGS &amp; ALARMS</text>
  </g>

  <!-- Bottom Telemetry Status Strip -->
  <g transform="translate(460, 292)">
    <rect x="-380" y="-13" width="760" height="26" rx="13" fill="#091426" fill-opacity="0.95" stroke="#1E3A5F" stroke-width="1" />
    <text x="0" y="3.5" text-anchor="middle" class="mono" font-size="9.5" fill="#94A3B8" letter-spacing="1.5">
      <tspan fill="#38BDF8">INFRASTRUCTURE STATUS:</tspan> HEALTHY [99.99% UPTIME] <tspan fill="#1E3A5F">|</tspan> IAM POLICIES: <tspan fill="#F0F6FC">ENFORCED</tspan> <tspan fill="#1E3A5F">|</tspan> <tspan fill="#60A5FA">REGION: AP-SOUTH-1</tspan>
    </text>
  </g>
</svg>
