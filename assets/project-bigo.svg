      <!-- O(N^2) curve -->
      <path d="M 52 166 Q 140 160 220 82" stroke="#9173E8" stroke-width="2.2" stroke-dasharray="4 4" fill="none" />
      <!-- O(N log N) curve -->
      <path d="M 52 166 Q 210 152 392 92" stroke="#4779E8" stroke-width="2.8" fill="none" />
      <!-- O(log N) curve -->
      <path d="M 52 166 Q 150 138 392 134" stroke="#27BFCB" stroke-width="2.5" fill="none" />
