<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="100%" height="340" fill="none" role="img" aria-label="Mukunda Experience and Leadership Timeline">
  <title>Experience &amp; Leadership Timeline — ThinkChamp, RGIPT, CollegeConnects, E-Cell RGIPT</title>
  <defs>
    <linearGradient id="timelineLine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4779E8" />
      <stop offset="50%" stop-color="#27BFCB" />
      <stop offset="100%" stop-color="#9173E8" />
    </linearGradient>
  </defs>

  <rect width="1000" height="340" rx="24" fill="#FFFFFF" stroke="#E5EAF2" stroke-width="1.5" />

  <!-- Vertical Pastel Connector Line -->
  <line x1="56" y1="36" x2="56" y2="304" stroke="url(#timelineLine)" stroke-width="3" stroke-linecap="round" />

  <!-- Item 1: AWS Cloud Intern — ThinkChamp -->
  <g transform="translate(0, 18)">
    <circle cx="56" cy="34" r="9" fill="#EAF5FF" stroke="#4779E8" stroke-width="3" />
    <rect x="88" y="6" width="884" height="64" rx="16" fill="#F8FBFF" stroke="#E5EAF2" stroke-width="1.2" />
    <text x="112" y="33" fill="#18243A" font-family="'Outfit', -apple-system, sans-serif" font-size="17" font-weight="700">AWS Cloud Intern — ThinkChamp</text>
    <text x="112" y="54" fill="#52627A" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">Hands-on implementation of AWS EC2, S3, Lambda, IAM, CloudWatch, SNS, and API Gateway.</text>
    <rect x="814" y="20" width="138" height="28" rx="14" fill="#EAF5FF" />
    <text x="883" y="38" text-anchor="middle" fill="#4779E8" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700">May–July 2026</text>
  </g>

  <!-- Item 2: AWS Student Builder Group Leader — RGIPT -->
  <g transform="translate(0, 96)">
    <circle cx="56" cy="34" r="9" fill="#DDFBFA" stroke="#27BFCB" stroke-width="3" />
    <rect x="88" y="6" width="884" height="64" rx="16" fill="#F8FBFF" stroke="#E5EAF2" stroke-width="1.2" />
    <text x="112" y="33" fill="#18243A" font-family="'Outfit', -apple-system, sans-serif" font-size="17" font-weight="700">AWS Student Builder Group Leader — RGIPT</text>
    <text x="112" y="54" fill="#52627A" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">Leading campus cloud computing workshops, study sessions, and peer cloud engineering initiatives at RGIPT.</text>
    <rect x="838" y="20" width="114" height="28" rx="14" fill="#DDFBFA" />
    <text x="895" y="38" text-anchor="middle" fill="#27BFCB" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700">RGIPT Lead</text>
  </g>

  <!-- Item 3: Chief Information Officer — CollegeConnects -->
  <g transform="translate(0, 174)">
    <circle cx="56" cy="34" r="9" fill="#F0EBFF" stroke="#9173E8" stroke-width="3" />
    <rect x="88" y="6" width="884" height="64" rx="16" fill="#F8FBFF" stroke="#E5EAF2" stroke-width="1.2" />
    <text x="112" y="33" fill="#18243A" font-family="'Outfit', -apple-system, sans-serif" font-size="17" font-weight="700">Chief Information Officer (CIO) — CollegeConnects</text>
    <text x="112" y="54" fill="#52627A" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">Directing full-stack architecture (React, FastAPI, MongoDB, Firebase) for the student college counselling platform.</text>
    <rect x="838" y="20" width="114" height="28" rx="14" fill="#F0EBFF" />
    <text x="895" y="38" text-anchor="middle" fill="#9173E8" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700">CIO Role</text>
  </g>

  <!-- Item 4: Technical Team Member — E-Cell RGIPT -->
  <g transform="translate(0, 252)">
    <circle cx="56" cy="34" r="9" fill="#FFF0F6" stroke="#4779E8" stroke-width="3" />
    <rect x="88" y="6" width="884" height="64" rx="16" fill="#F8FBFF" stroke="#E5EAF2" stroke-width="1.2" />
    <text x="112" y="33" fill="#18243A" font-family="'Outfit', -apple-system, sans-serif" font-size="17" font-weight="700">Technical Team Member — E-Cell RGIPT</text>
    <text x="112" y="54" fill="#52627A" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">Developing and maintaining web portals and technical infrastructure for entrepreneurship initiatives at RGIPT.</text>
    <rect x="838" y="20" width="114" height="28" rx="14" fill="#FFF0F6" />
    <text x="895" y="38" text-anchor="middle" fill="#4779E8" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700">Tech Team</text>
  </g>
</svg>