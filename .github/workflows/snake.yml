name: Generate Light-Theme Contribution Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: GenerateMurari182 Light-Theme Contribution Snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Murari182
          outputs: |
            assets/contribution-snake.svg?palette=github-light&color_snake=#4779E8&color_dots=#F8FBFF,#EAF5FF,#DDFBFA,#4779E8,#9173E8
            assets/github-snake.svg?palette=github-light&color_snake=#4779E8&color_dots=#F8FBFF,#EAF5FF,#DDFBFA,#4779E8,#9173E8

      - name: Commit & Push updated Contribution Snake
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update Murari182 light-theme contribution snake SVG"
          file_pattern: "assets/*.svg"
